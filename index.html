
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#236b4b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="My Groceries">
<title>My Grocery Shopping List</title>

<style>
:root {
    --primary: #236b4b;
    --primary-light: #e8f3ed;
    --background: #f5f7f5;
    --text: #222;
    --border: #d5ddd8;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: var(--background);
    color: var(--text);
    font-size: 18px;
}

header {
    background: var(--primary);
    color: white;
    padding: 25px 16px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 30px;
}

header p {
    margin-bottom: 0;
    font-size: 17px;
}

main {
    max-width: 850px;
    margin: auto;
    padding: 18px;
}

button, input, select {
    font: inherit;
}

button {
    cursor: pointer;
    border: none;
    border-radius: 8px;
    padding: 13px 18px;
    font-weight: bold;
}

.primary-btn {
    background: var(--primary);
    color: white;
}

.secondary-btn {
    background: #e5eae7;
    color: #222;
}

.danger-btn {
    background: #b52b2b;
    color: white;
}

.panel {
    background: white;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 18px;
    border: 1px solid var(--border);
}

h2 {
    font-size: 23px;
    margin-top: 0;
}

h3 {
    font-size: 20px;
    color: var(--primary);
}

input[type="text"], input[type="number"], select {
    width: 100%;
    padding: 13px;
    border: 1px solid #aaa;
    border-radius: 8px;
    margin-top: 6px;
    background: white;
    min-height: 48px;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 8px;
}

button:focus, input:focus, select:focus {
    outline: 3px solid #e2aa36;
    outline-offset: 2px;
}

.top-actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 15px;
}

.top-actions button {
    flex: 1;
    min-width: 130px;
}

.category-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 15px 0;
}

.category-btn {
    background: #e8ece9;
    color: #222;
    padding: 12px 15px;
}

.category-btn.active {
    background: var(--primary);
    color: white;
}

.item-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 5px;
    border-bottom: 1px solid #eee;
    min-height: 65px;
}

.item-row input[type="checkbox"] {
    width: 26px;
    height: 26px;
    flex-shrink: 0;
    cursor: pointer;
    accent-color: var(--primary);
}

.item-name {
    flex: 1;
    font-size: 18px;
}

.item-quantity {
    width: 115px !important;
    margin: 0 !important;
    padding: 9px !important;
}

.selected-row {
    background: var(--primary-light);
    border-radius: 6px;
}

.list-entry {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 0;
    border-bottom: 1px solid #ddd;
}

.list-entry input[type="checkbox"] {
    width: 25px;
    height: 25px;
    accent-color: var(--primary);
}

.list-entry span {
    flex: 1;
}

.list-entry.done span {
    text-decoration: line-through;
    color: #777;
}

.list-entry button {
    padding: 8px 12px;
}

.small-text {
    color: #666;
    font-size: 15px;
}

.empty {
    color: #777;
    text-align: center;
    padding: 25px 5px;
}

.hidden {
    display: none !important;
}

@media print {
    body {
        background: white;
        font-size: 14px;
    }

    header {
        background: white;
        color: black;
        padding: 10px;
    }

    main {
        padding: 0;
    }

    .no-print {
        display: none !important;
    }

    .panel {
        border: none;
        padding: 5px;
    }

    .list-entry {
        border-bottom: 1px solid #ccc;
    }
}

@media (max-width: 500px) {
    main {
        padding: 10px;
    }

    .panel {
        padding: 15px;
    }

    header h1 {
        font-size: 25px;
    }

    .item-quantity {
        width: 90px !important;
    }
}
</style>
</head>

<body>

<header>
    <h1>🛒 My Grocery Shopping List</h1>
    <p>Simple shopping planner for your household</p>
</header>

<main>

    <!-- LIST MANAGEMENT -->
    <section class="panel no-print">
        <h2>My Shopping Lists</h2>

        <label for="savedLists">Select a shopping list</label>
        <select id="savedLists"></select>

        <div class="top-actions">
            <button class="primary-btn" onclick="newList()">
                + Create New List
            </button>

            <button class="secondary-btn" onclick="renameList()">
                Rename List
            </button>

            <button class="danger-btn" onclick="deleteList()">
                Delete List
            </button>
        </div>

        <p class="small-text" id="listDate"></p>
    </section>

    <!-- ADD ITEMS -->
    <section class="panel no-print">
        <h2>Select Items to Buy</h2>

        <label for="search">Search for an item</label>
        <input
            type="text"
            id="search"
            placeholder="Example: Rice, Chicken, Soap..."
            oninput="renderItems()"
        >

        <div class="category-list" id="categories"></div>

        <div id="itemsContainer"></div>
    </section>

    <!-- CURRENT LIST -->
    <section class="panel">
        <h2>My Selected Items</h2>

        <p class="small-text">
            Tick items as you put them in your shopping trolley.
        </p>

        <div id="selectedItems"></div>

        <p id="itemCount" class="small-text"></p>

        <div class="top-actions no-print">
            <button class="primary-btn" onclick="window.print()">
                🖨 Print Shopping List
            </button>

            <button class="secondary-btn" onclick="clearCompleted()">
                Remove Purchased Items
            </button>
        </div>
    </section>

    <p class="small-text" style="text-align:center">
        Your shopping lists are saved automatically on this device.
    </p>

</main>

<script>

// ======================================
// GROCERY CATALOGUE
// ======================================

const catalogue = {

    "Staples": [
        ["Rice", "5 kg"],
        ["Flour", "5 kg"],
        ["Red lentils (Dholl)", "1 kg"],
        ["Gros pois", "1 kg"],
        ["Dry beans", "500 g"],
        ["Pasta / Spaghetti", "2 kg"],
        ["Macaroni", "1 kg"],
        ["Noodles", "6 packets"],
        ["Oats", "1 kg"],
        ["Cornflour", "500 g"]
    ],

    "Meat & Poultry": [
        ["Chicken", "4 kg"],
        ["Chicken breast", "1 kg"],
        ["Beef", "1 kg"],
        ["Minced meat", "500 g"],
        ["Sausages", "500 g"]
    ],

    "Fish": [
        ["Fish", "1.5 kg"],
        ["Fish fillets", "500 g"],
        ["Canned tuna", "4 tins"]
    ],

    "Dairy & Eggs": [
        ["Milk", "6 litres"],
        ["Cheese", "500 g"],
        ["Butter / Margarine", "500 g"],
        ["Yoghurt", "1 kg"],
        ["Eggs", "30"]
    ],

    "Vegetables": [
        ["Potatoes", "1 kg"],
        ["Onions", "750 g"],
        ["Carrots", "500 g"],
        ["Cabbage", "1/2"],
        ["Pumpkin", "500 g"],
        ["Cucumber", "1"],
        ["Lettuce", "1"],
        ["Green beans", "375 g"],
        ["Chouchou", "500 g"],
        ["Brèdes", "1 bunch"],
        ["Aubergines", "250 g"],
        ["Fresh coriander", "1 bunch"],
        ["Green chillies", "50 g"],
        ["Garlic", "500 g"],
        ["Ginger", "250 g"]
    ],

    "Fruits": [
        ["Bananas", "6"],
        ["Apples", "2"],
        ["Oranges", "2"],
        ["Papaya", "1/2"],
        ["Seasonal fruits", "500 g"]
    ],

    "Breakfast": [
        ["Bread", "2 loaves"],
        ["Breakfast cereal / Muesli", "1 kg"],
        ["Peanut butter", "500 g"],
        ["Jam", "500 g"],
        ["Honey", "250 g"],
        ["Tea bags", "100 bags"],
        ["Coffee", "200 g"],
        ["Sugar", "1 kg"]
    ],

    "Cooking Essentials": [
        ["Cooking oil", "2 litres"],
        ["Salt", "1 kg"],
        ["Black pepper", "1 packet"],
        ["Turmeric powder", "100 g"],
        ["Chilli powder", "100 g"],
        ["Garam masala", "100 g"],
        ["Cumin seeds", "100 g"],
        ["Mustard seeds", "100 g"],
        ["Curry leaves", "1 packet"],
        ["Stock cubes", "1 box"],
        ["Tomato paste", "2 tins"],
        ["Soy sauce", "1 bottle"],
        ["Vinegar", "1 bottle"],
        ["Mayonnaise", "1 jar"],
        ["Chilli sauce", "1 bottle"],
        ["Coconut milk", "2 packets"],
        ["Tomato sauce", "1 bottle"],
        ["Canned baked beans", "2 tins"],
        ["Canned sweetcorn", "2 tins"]
    ],

    "Cleaning Products": [
        ["Dishwashing liquid", "1 litre"],
        ["Laundry detergent", "2 kg"],
        ["Fabric softener", "1 litre"],
        ["Floor cleaner", "1 litre"],
        ["Toilet cleaner", "1 bottle"],
        ["Bathroom disinfectant", "1 bottle"],
        ["Multipurpose cleaner", "1 bottle"],
        ["Bleach", "1 litre"],
        ["Sponges", "3"],
        ["Garbage bags", "1 roll"],
        ["Kitchen paper towels", "2 rolls"],
        ["Toilet paper", "12 rolls"]
    ],

    "Personal Hygiene": [
        ["Bath soap", "4 bars"],
        ["Shampoo", "1 bottle"],
        ["Conditioner", "1 bottle"],
        ["Toothpaste", "2 tubes"],
        ["Toothbrushes", "2"],
        ["Deodorant", "2"],
        ["Body lotion", "1 bottle"],
        ["Handwash", "1 bottle"],
        ["Sanitary products", "1 pack"]
    ]
};

// ======================================
// APPLICATION DATA
// ======================================

let lists = JSON.parse(
    localStorage.getItem("groceryLists") || "{}"
);

let currentListId = null;
let currentCategory = "All";

// ======================================
// STORAGE
// ======================================

function saveData() {
    localStorage.setItem(
        "groceryLists",
        JSON.stringify(lists)
    );
}

function escapeHTML(value) {
    return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
    })[char]);
}

// ======================================
// LIST MANAGEMENT
// ======================================

function newList() {

    const name = prompt(
        "Enter a name for your shopping list:",
        "Shopping List - " + new Date().toLocaleDateString()
    );

    if (!name || !name.trim()) return;

    const id = Date.now().toString();

    lists[id] = {
        name: name.trim(),
        date: new Date().toLocaleDateString(),
        items: {}
    };

    currentListId = id;

    saveData();
    renderAll();
}

function renameList() {

    const list = lists[currentListId];
    if (!list) return;

    const name = prompt(
        "Enter the new list name:",
        list.name
    );

    if (!name || !name.trim()) return;

    list.name = name.trim();

    saveData();
    renderAll();
}

function deleteList() {

    if (!currentListId) return;

    if (!confirm("Are you sure you want to delete this shopping list?")) {
        return;
    }

    delete lists[currentListId];

    currentListId = Object.keys(lists)[0] || null;

    saveData();
    renderAll();
}

function switchList(id) {
    currentListId = id;
    renderAll();
}

function initialise() {

    if (Object.keys(lists).length === 0) {
        const id = Date.now().toString();

        lists[id] = {
            name: "My First Shopping List",
            date: new Date().toLocaleDateString(),
            items: {}
        };

        currentListId = id;
        saveData();
    } else {
        currentListId = Object.keys(lists)[0];
    }

    renderAll();
}

// ======================================
// DISPLAY SAVED LISTS
// ======================================

function renderLists() {

    const select = document.getElementById("savedLists");

    select.innerHTML = "";

    Object.entries(lists).forEach(([id, list]) => {

        const option = document.createElement("option");

        option.value = id;
        option.textContent = list.name;

        select.appendChild(option);
    });

    select.value = currentListId || "";

    select.onchange = () => switchList(select.value);

    const list = lists[currentListId];

    document.getElementById("listDate").textContent =
        list ? "Created: " + list.date : "";
}

// ======================================
// CATEGORY NAVIGATION
// ======================================

function renderCategories() {

    const container = document.getElementById("categories");

    const categories = ["All", ...Object.keys(catalogue)];

    container.innerHTML = "";

    categories.forEach(category => {

        const button = document.createElement("button");

        button.className =
            "category-btn " +
            (currentCategory === category ? "active" : "");

        button.textContent = category;

        button.onclick = () => {
            currentCategory = category;
            renderCategories();
            renderItems();
        };

        container.appendChild(button);
    });
}

// ======================================
// ADD OR REMOVE ITEMS
// ======================================

function toggleItem(name, defaultQuantity) {

    const items = lists[currentListId].items;

    if (items[name]) {
        delete items[name];
    } else {
        items[name] = {
            quantity: defaultQuantity,
            bought: false
        };
    }

    saveData();
    renderAll();
}

function updateQuantity(name, quantity) {

    lists[currentListId].items[name].quantity = quantity;

    saveData();
    renderSelectedItems();
}

// ======================================
// DISPLAY CATALOGUE
// ======================================

function renderItems() {

    const container = document.getElementById("itemsContainer");
    const search = document.getElementById("search").value.toLowerCase();

    const items = lists[currentListId]?.items || {};

    container.innerHTML = "";

    Object.entries(catalogue).forEach(([category, products]) => {

        if (currentCategory !== "All" && currentCategory !== category) {
            return;
        }

        const filtered = products.filter(([name]) =>
            name.toLowerCase().includes(search)
        );

        if (filtered.length === 0) return;

        const heading = document.createElement("h3");
        heading.textContent = category;
        container.appendChild(heading);

        filtered.forEach(([name, quantity]) => {

            const selected = !!items[name];

            const row = document.createElement("div");

            row.className = "item-row" +
                (selected ? " selected-row" : "");

            const checkbox = document.createElement("input");
            checkbox.type = "checkbox";
            checkbox.checked = selected;

            checkbox.onchange = () =>
                toggleItem(name, quantity);

            const label = document.createElement("span");
            label.className = "item-name";
            label.textContent = name;

            const qty = document.createElement("input");
            qty.type = "text";
            qty.className = "item-quantity";
            qty.placeholder = "Quantity";
            qty.value = selected ? items[name].quantity : quantity;
            qty.disabled = !selected;
            qty.setAttribute("aria-label", "Quantity for " + name);

            qty.onchange = () =>
                updateQuantity(name, qty.value);

            row.appendChild(checkbox);
            row.appendChild(label);
            row.appendChild(qty);

            container.appendChild(row);
        });
    });
}

// ======================================
// DISPLAY SELECTED SHOPPING ITEMS
// ======================================

function renderSelectedItems() {

    const container = document.getElementById("selectedItems");

    const items = lists[currentListId]?.items || {};

    container.innerHTML = "";

    const entries = Object.entries(items);

    if (entries.length === 0) {

        container.innerHTML =
            '<div class="empty">No items selected yet.<br>Select items from the list above.</div>';

    } else {

        entries.forEach(([name, data]) => {

            const row = document.createElement("div");

            row.className = "list-entry" +
                (data.bought ? " done" : "");

            const checkbox = document.createElement("input");
            checkbox.type = "checkbox";
            checkbox.checked = data.bought;
            checkbox.setAttribute("aria-label", "Mark " + name + " as purchased");

            checkbox.onchange = () => {

                data.bought = checkbox.checked;

                saveData();
                renderSelectedItems();
            };

            const text = document.createElement("span");

            text.textContent =
                name + " — " + data.quantity;

            const remove = document.createElement("button");
            remove.className = "danger-btn";
            remove.textContent = "Remove";
            remove.setAttribute("aria-label", "Remove " + name);

            remove.onclick = () => {
                delete lists[currentListId].items[name];
                saveData();
                renderAll();
            };

            row.appendChild(checkbox);
            row.appendChild(text);
            row.appendChild(remove);

            container.appendChild(row);
        });
    }

    const remaining = entries.filter(
        ([name, data]) => !data.bought
    ).length;

    document.getElementById("itemCount").textContent =
        entries.length + " items selected | " +
        remaining + " items remaining";
}

// ======================================
// REMOVE PURCHASED ITEMS
// ======================================

function clearCompleted() {

    const items = lists[currentListId].items;

    Object.keys(items).forEach(name => {

        if (items[name].bought) {
            delete items[name];
        }
    });

    saveData();
    renderAll();
}

// ======================================
// RENDER APPLICATION
// ======================================

function renderAll() {

    renderLists();
    renderCategories();
    renderItems();
    renderSelectedItems();
}

// START
initialise();

</script>
<script>
if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js");
    });
}
</script>

</body>
</html>
